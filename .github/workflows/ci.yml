name: Cortana CI

on:
  pull_request:
  push:
    branches: [main, "setup/**", "feature/**", "fix/**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,web]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run browser predictive lip-sync tests
        run: node --test tests/js/predictive-lipsync.test.cjs
      - name: Run browser scheduler tests
        run: node --test tests/js/visemes.test.cjs
      - name: Run browser audio-clock tests
        run: node --test tests/js/audio-clock.test.cjs
      - name: Run browser viseme-provider tests
        run: node --test tests/js/viseme-provider.test.cjs
      - name: Run browser phoneme alignment tests
        run: node --test tests/js/phoneme-alignment.test.cjs
      - name: Run browser neural viseme predictor tests
        run: node --test tests/js/neural-viseme-predictor.test.cjs
      - name: Run browser phoneme provider integration tests
        run: node --test tests/js/phoneme-provider.test.cjs
      - name: Run browser facial-intelligence tests
        run: node --test tests/js/facial-intelligence.test.cjs
      - name: Run browser Unreal bridge tests
        run: node --test tests/js/unreal-bridge.test.cjs
