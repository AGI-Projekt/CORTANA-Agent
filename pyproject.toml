[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortana-agent"
version = "0.1.0"
description = "Cross-platform Cortana agent foundation for Windows and Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "CORTANA-Agent contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.115", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]
llm = ["openai>=2.0.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
